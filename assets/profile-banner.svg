<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Khairul Fawwaz — Embedded Systems, Edge AI and Automation</title>
  <desc id="desc">A technical portfolio banner showing a signal travelling from sensing hardware through digital processing and a neural network to a real-time output.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b16"/>
      <stop offset="0.52" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#101735"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.48" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#93c5fd" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="378" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle cx="1005" cy="78" r="255" fill="url(#glowViolet)"/>
    <circle cx="790" cy="320" r="230" fill="url(#glowCyan)"/>

    <path d="M0 320 C230 264 320 384 520 314 S830 274 1200 326" fill="none" stroke="url(#accent)" stroke-opacity="0.13" stroke-width="2"/>
    <path d="M0 337 C225 281 340 398 535 331 S850 293 1200 343" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>

    <g transform="translate(70 64)">
      <rect x="0" y="0" width="104" height="30" rx="15" fill="#0f2534" stroke="#2dd4bf" stroke-opacity="0.55"/>
      <circle cx="17" cy="15" r="4" fill="#2dd4bf" filter="url(#softGlow)"/>
      <text x="31" y="20" fill="#99f6e4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">ENGINEER</text>

      <text x="0" y="88" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="47" font-weight="750" letter-spacing="0.2">KHAIRUL FAWWAZ</text>
      <rect x="0" y="111" width="428" height="4" rx="2" fill="url(#accent)"/>
      <text x="0" y="153" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.7">EMBEDDED SYSTEMS  •  EDGE AI  •  AUTOMATION</text>
      <text x="0" y="196" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="17">Building intelligent real-time systems from sensor to silicon.</text>

      <g transform="translate(0 238)">
        <rect width="142" height="38" rx="19" fill="#0c2130" stroke="#2dd4bf" stroke-opacity="0.45"/>
        <text x="71" y="24" text-anchor="middle" fill="#ccfbf1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650">C / C++ FIRMWARE</text>
        <rect x="154" width="110" height="38" rx="19" fill="#0c1e35" stroke="#38bdf8" stroke-opacity="0.45"/>
        <text x="209" y="24" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650">RTOS + DSP</text>
        <rect x="276" width="118" height="38" rx="19" fill="#171b3c" stroke="#818cf8" stroke-opacity="0.48"/>
        <text x="335" y="24" text-anchor="middle" fill="#e0e7ff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650">TINYML</text>
      </g>
    </g>

    <g transform="translate(630 52)">
      <rect x="0" y="0" width="500" height="276" rx="24" fill="#07111f" fill-opacity="0.72" stroke="#94a3b8" stroke-opacity="0.18"/>
      <text x="28" y="34" fill="#64748b" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">REAL-TIME INTELLIGENCE PIPELINE</text>

      <!-- sensing node -->
      <g transform="translate(52 82)">
        <circle cx="36" cy="52" r="35" fill="#0b2230" stroke="#2dd4bf" stroke-width="1.5"/>
        <path d="M26 52 C29 41 34 41 37 52 S45 63 48 52" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
        <path d="M16 52 C21 30 28 30 33 52 M52 52 C57 30 64 30 69 52" fill="none" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="2"/>
        <text x="36" y="108" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">SENSE</text>
      </g>

      <!-- signal path -->
      <path d="M126 134 H170" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4 5"/>
      <circle cx="148" cy="134" r="3" fill="#2dd4bf" filter="url(#softGlow)"/>

      <!-- processing block -->
      <g transform="translate(172 88)">
        <rect width="92" height="92" rx="16" fill="#0b1d32" stroke="#38bdf8" stroke-width="1.5"/>
        <g fill="#38bdf8">
          <rect x="20" y="55" width="7" height="18" rx="2"/>
          <rect x="33" y="39" width="7" height="34" rx="2" opacity="0.75"/>
          <rect x="46" y="25" width="7" height="48" rx="2"/>
          <rect x="59" y="45" width="7" height="28" rx="2" opacity="0.75"/>
        </g>
        <path d="M18 23 C31 10 39 34 51 19 S70 28 75 16" fill="none" stroke="#7dd3fc" stroke-width="2"/>
        <text x="46" y="118" text-anchor="middle" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">PROCESS</text>
      </g>

      <path d="M264 134 H306" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 5"/>
      <circle cx="285" cy="134" r="3" fill="#38bdf8" filter="url(#softGlow)"/>

      <!-- neural inference block -->
      <g transform="translate(307 87)">
        <rect width="92" height="94" rx="16" fill="#111735" stroke="#818cf8" stroke-width="1.5"/>
        <g stroke="#818cf8" stroke-opacity="0.48" stroke-width="1.2">
          <path d="M23 25 L47 19 L70 29 M23 25 L47 48 L70 29 M23 48 L47 19 L70 58 M23 70 L47 48 L70 58 M23 70 L47 76 L70 58"/>
        </g>
        <g fill="#c7d2fe" stroke="#818cf8">
          <circle cx="23" cy="25" r="5"/><circle cx="23" cy="48" r="5"/><circle cx="23" cy="70" r="5"/>
          <circle cx="47" cy="19" r="5"/><circle cx="47" cy="48" r="5"/><circle cx="47" cy="76" r="5"/>
          <circle cx="70" cy="29" r="5"/><circle cx="70" cy="58" r="5"/>
        </g>
        <text x="46" y="119" text-anchor="middle" fill="#c7d2fe" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">INFER</text>
      </g>

      <path d="M399 134 H434" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 5"/>
      <circle cx="417" cy="134" r="3" fill="#818cf8" filter="url(#softGlow)"/>

      <!-- output node -->
      <g transform="translate(433 93)">
        <rect width="44" height="82" rx="12" fill="#172033" stroke="#f59e0b" stroke-opacity="0.8"/>
        <circle cx="22" cy="25" r="7" fill="#f59e0b" filter="url(#softGlow)"/>
        <rect x="12" y="45" width="20" height="3" rx="1.5" fill="#fbbf24" opacity="0.85"/>
        <rect x="12" y="54" width="14" height="3" rx="1.5" fill="#fbbf24" opacity="0.55"/>
        <text x="22" y="113" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">ACT</text>
      </g>

      <g transform="translate(28 226)">
        <circle cx="5" cy="5" r="5" fill="#2dd4bf"/>
        <text x="18" y="10" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">ADC</text>
        <circle cx="93" cy="5" r="5" fill="#38bdf8"/>
        <text x="106" y="10" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">MFCC</text>
        <circle cx="185" cy="5" r="5" fill="#818cf8"/>
        <text x="198" y="10" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">INT8 CNN</text>
        <circle cx="305" cy="5" r="5" fill="#f59e0b"/>
        <text x="318" y="10" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">REAL-TIME OUTPUT</text>
      </g>
    </g>

    <rect x="0" y="374" width="1200" height="6" fill="url(#accent)"/>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="24" fill="none" stroke="#94a3b8" stroke-opacity="0.22" stroke-width="2"/>
</svg>
