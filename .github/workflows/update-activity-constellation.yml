name: Refresh activity constellation

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-constellation
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the profile source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Test calendar sequencing and brightness
        run: python -m unittest discover -s tests -v

      - name: Render public contribution activity
        run: >
          python scripts/render_activity_constellation.py
          --user "${{ github.repository_owner }}"
          --output "$RUNNER_TEMP/activity-constellation.svg"
          --player-dir "$RUNNER_TEMP/activity-player"

      - name: Publish the refreshed visual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin activity-output
          git worktree add "$RUNNER_TEMP/activity-output" origin/activity-output
          cp "$RUNNER_TEMP/activity-constellation.svg" "$RUNNER_TEMP/activity-output/activity-constellation.svg"
          cp "$RUNNER_TEMP/activity-player/activity-constellation-play.svg" "$RUNNER_TEMP/activity-output/activity-constellation-play.svg"
          cp "$RUNNER_TEMP/activity-player/PLAY.md" "$RUNNER_TEMP/activity-output/PLAY.md"
          cd "$RUNNER_TEMP/activity-output"
          git switch -c activity-output --track origin/activity-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- activity-constellation.svg activity-constellation-play.svg PLAY.md
          if git diff --cached --quiet; then
            echo "Activity visual is already current."
            exit 0
          fi
          git commit -m "Refresh activity constellation"
          git push origin HEAD:activity-output
